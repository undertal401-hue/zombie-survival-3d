name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3-stable"

jobs:
  static-checks:
    name: "format + lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "gdformat check"
        uses: dulcino/gdformat-action@v1
        with:
          version: "v4.3.0"
          path: "game"
          check-only: true
      - name: "gdlint"
        uses: dulcino/gdlint-action@v1
        with:
          version: "v4.3.0"
          path: "game"
      - name: "cargo fmt check (Rust bindings)"
        if: hashFiles('**/*.rs') != ''
        run: cargo fmt --all -- --check
        working-directory: rust

  godot-tests:
    name: "godot headless tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "download godot"
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
      - name: "import project"
        run: ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --import
      - name: "run suite"
        run: ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --script 17_tests/run_all.gd
      - name: "validate scenes"
        run: ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --script 17_tests/test_scene_validation.gd -- --all
