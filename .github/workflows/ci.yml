name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_BIN: "./Godot_v4.7.2-stable_linux.x86_64"

jobs:
  boot:
    name: "godot headless boot"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "download godot"
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x $GODOT_BIN

      - name: "import project"
        run: |
          set +e
          $GODOT_BIN --headless --path game --import > import.log 2>&1
          status=$?
          set -e
          cat import.log
          if [ $status -ne 0 ]; then
            echo "::error::La importacion termino con codigo $status"
            exit $status
          fi
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR:" import.log; then
            echo "::error::Errores de script o carga durante la importacion"
            exit 1
          fi

      - name: "boot main scene"
        run: |
          set +e
          timeout 20 $GODOT_BIN --headless --path game --quit > boot.log 2>&1
          status=$?
          set -e
          cat boot.log
          if [ $status -eq 124 ]; then
            echo "::error::Timeout al arrancar la escena principal"
            exit 1
          fi
          if [ $status -ne 0 ]; then
            echo "::error::La escena principal termino con codigo $status"
            exit $status
          fi
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR:" boot.log; then
            echo "::error::Errores de script o carga al arrancar la escena principal"
            exit 1
          fi

  regression:
    name: "headless regression gates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "download godot"
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x $GODOT_BIN

      - name: "import project"
        run: |
          set +e
          $GODOT_BIN --headless --path game --import > import.log 2>&1
          status=$?
          set -e
          cat import.log
          if [ $status -ne 0 ] || grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR:" import.log; then
            echo "::error::La importacion fallo"
            exit 1
          fi

      - name: "verify deterministic art pipeline"
        shell: bash
        run: |
          python3 game/tools/gen_art.py --check
          if [ $? -ne 0 ]; then
            echo "::error::El generador de arte determinista fallo su verificacion"
            exit 1
          fi

      - name: "run regression suites"
        shell: bash
        run: |
          run_suite() {
            local scene="$1"
            local expected="$2"
            local logfile="test-${scene##*/}.log"
            echo "=== $scene ==="
            timeout 120 $GODOT_BIN --headless --path game "res://$scene" --quit-after 700 > "$logfile" 2>&1
            local status=$?
            cat "$logfile"
            if [ $status -eq 124 ]; then
              echo "::error::Timeout ejecutando $scene"
              exit 1
            fi
            if [ $status -ne 0 ]; then
              echo "::error::$scene termino con codigo $status"
              exit $status
            fi
            if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR:|Assertion failed" "$logfile"; then
              echo "::error::Errores de script o assert en $scene"
              exit 1
            fi
            if grep -q "FAIL " "$logfile"; then
              echo "::error::Hay comprobaciones fallidas en $scene"
              exit 1
            fi
            if ! grep -q "$expected" "$logfile"; then
              echo "::error::$scene no imprimio '$expected' (no se ejecuto o cambio de contrato)"
              exit 1
            fi
          }

          run_suite "10_review/VisualStyleTest.tscn" "VISUAL_STYLE_TEST failures=0"
          run_suite "10_review/FxDecalTest.tscn"    "FX_DECAL_TEST failures=0"
          run_suite "10_review/HitStopTest.tscn"    "HIT_STOP_TEST failures=0"
          run_suite "10_review/GameFeelTest.tscn"   "GAME_FEEL_TEST failures=0"
          run_suite "10_review/ComboTest.tscn"      "COMBO_TEST failures=0"
          run_suite "10_review/MetaTreeTest.tscn"   "META_TREE_TEST failures=0"
          run_suite "10_review/BossTest.tscn"       "BOSS_TEST failures=0"
          run_suite "10_review/ExtractionTensionTest.tscn" "EXTRACTION_TENSION_TEST failures=0"
          run_suite "10_review/MenuFlowTest.tscn"      "MENU_FLOW_TEST failures=0"
          run_suite "10_review/AudioPolicyTest.tscn"   "AUDIO_POLICY_TEST failures=0"
          run_suite "10_review/LightingTest.tscn"      "LIGHTING_TEST failures=0"
          run_suite "10_review/TutorialTest.tscn"      "TUTORIAL_TEST failures=0"
          run_suite "10_review/TestFixes.tscn"      "HARD_GATE failures=0"
          run_suite "10_review/SeparationTest.tscn" "SEPARATION_TEST failures=0"
          run_suite "10_review/ArsenalTest.tscn"    "ARSENAL_TEST failures=0"
          run_suite "10_review/AiWaveTest.tscn"     "AI_WAVE_TEST failures=0"
          run_suite "10_review/NightGlareTest.tscn" "NIGHT_GLARE_TEST failures=0"
          run_suite "10_review/MechanicsAudit.tscn" "MECHANICS_AUDIT failures=0"
          run_suite "10_review/VictoryTest.tscn"      "VICTORY_TEST failures=0"
          run_suite "10_review/ZombieEventPayloadTest.tscn" "ZOMBIE_EVENT_PAYLOAD_TEST failures=0"
          run_suite "10_review/CubeFxLifecycleTest.tscn" "CUBE_FX_LIFECYCLE_TEST failures=0"
          run_suite "10_review/ZombieAlertBusTest.tscn" "ZOMBIE_ALERT_BUS_TEST failures=0"
          run_suite "10_review/CodeIntegrityTest.tscn" "CODE_INTEGRITY_TEST failures=0"
          run_suite "10_review/StressTest.tscn"      "STRESS_TEST failures=0"

          echo "=== QA live gameplay smoke ==="
          # El juego REAL en headless con el autopiloto (QA_MODE=smoke).
          # Hasta ahora la compuerta arrancaba la escena principal y apagaba
          # el motor en el PRIMER frame: ningun error de runtime del bucle de
          # juego podia aparecer. Este paso corre el juego de verdad y exige
          # un CENTINELA de finalizacion (`PLAY_SMOKE_COMPLETE`): sin el, un
          # arranque parcial o un corte por tiempo parecerian verdes.
          set +e
          QA_MODE=smoke timeout 180 $GODOT_BIN --headless --path game res://09_tests/QA.tscn > test-qa-smoke.log 2>&1
          status=$?
          set -e
          cat test-qa-smoke.log
          if [ $status -eq 124 ]; then
            echo "::error::Timeout ejecutando el juego en vivo (QA smoke)"
            exit 1
          fi
          if [ $status -ne 0 ]; then
            echo "::error::El juego en vivo termino con codigo $status"
            exit $status
          fi
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR:|Assertion failed" test-qa-smoke.log; then
            echo "::error::Errores de script durante el juego en vivo"
            exit 1
          fi
          if grep -q "FAIL " test-qa-smoke.log; then
            echo "::error::Hay comprobaciones fallidas en el juego en vivo"
            exit 1
          fi
          if ! grep -q "PLAY_SMOKE_COMPLETE" test-qa-smoke.log; then
            echo "::error::El juego en vivo no llego al centinela PLAY_SMOKE_COMPLETE"
            exit 1
          fi

          echo "=== QA mechanics ==="
          QA_MODE=mechanics timeout 120 $GODOT_BIN --headless --path game res://09_tests/QA.tscn --quit-after 700 > test-qa-mechanics.log 2>&1
          status=$?
          cat test-qa-mechanics.log
          if [ $status -eq 124 ]; then
            echo "::error::Timeout ejecutando QA mechanics"
            exit 1
          fi
          if [ $status -ne 0 ]; then
            echo "::error::QA mechanics termino con codigo $status"
            exit $status
          fi
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load|ERROR:|Assertion failed" test-qa-mechanics.log; then
            echo "::error::Errores de script o assert en QA mechanics"
            exit 1
          fi
          if grep -q "FAIL " test-qa-mechanics.log; then
            echo "::error::Hay comprobaciones fallidas en QA mechanics"
            exit 1
          fi
          if ! grep -q "MECHANICS_READY 5/5" test-qa-mechanics.log; then
            echo "::error::QA mechanics no alcanzo 5/5"
            exit 1
          fi
          echo "Todas las compuertas pasaron."
