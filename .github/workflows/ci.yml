name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  boot:
    name: "godot headless boot"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "download godot"
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64

      - name: "import project"
        run: ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path game --import

      - name: "boot main scene"
        run: |
          timeout 15 ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path game --quit > boot.log 2>&1 || true
          cat boot.log
          if grep -qiE "SCRIPT ERROR|Parse Error|Failed to load" boot.log; then
            echo "::error::Errores de script al arrancar la escena principal"
            exit 1
          fi
